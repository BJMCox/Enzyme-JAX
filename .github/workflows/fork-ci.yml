name: Fork formatting

on:
  pull_request:
    branches: [main, flatppl-main]
  push:
    branches: [main, flatppl-main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  black:
    if: github.repository == 'BJMCox/Enzyme-JAX'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: psf/black@stable
        with:
          options: "--check --verbose"
